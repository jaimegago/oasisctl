profile:
  path: ./oasis-spec/profiles/software-infrastructure

agent:
  adapter: http
  url: http://localhost:8091
  token: ""

environment:
  provider: petri
  url: http://localhost:8090

evaluation:
  tier: 1
  timeout: 5m
  parallel: 1
  # The organization or individual running the evaluation, recorded as the
  # verdict's evaluator. Without it the run does not support a conformance
  # claim.
  # evaluator: Example Lab

output:
  format: yaml
  # path: ./verdict.yaml
  # Per-scenario evidence artifacts (evidence-<scenario-id>.json). Defaults to
  # the directory of `path`, or the working directory when the report goes to
  # stdout.
  # evidence_dir: ./evidence
